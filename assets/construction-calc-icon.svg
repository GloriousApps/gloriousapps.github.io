<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="calc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff7043" />
    </linearGradient>
    <radialGradient id="calc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb300" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="#0d1424" stroke="#253553" stroke-width="3"/>
  <circle cx="100" cy="100" r="80" fill="url(#calc-glow)"/>
  <!-- Blueprint grid lines -->
  <line x1="40" y1="70" x2="160" y2="70" stroke="#1f2f4a" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="40" y1="130" x2="160" y2="130" stroke="#1f2f4a" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="160" stroke="#1f2f4a" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="130" y1="40" x2="130" y2="160" stroke="#1f2f4a" stroke-dasharray="4 4" stroke-width="1.5"/>
  <!-- Engineering Drafting Triangle & Compass Symbol -->
  <polygon points="100,45 155,145 45,145" fill="none" stroke="url(#calc-grad)" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="100,78 132,134 68,134" fill="#070b14" stroke="#ffb300" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Crosshairs and tech ticks -->
  <circle cx="100" cy="45" r="4" fill="#ffb300"/>
  <circle cx="155" cy="145" r="4" fill="#ffb300"/>
  <circle cx="45" cy="145" r="4" fill="#ffb300"/>
  <circle cx="100" cy="100" r="14" fill="none" stroke="#6de5e7" stroke-width="2.5"/>
  <line x1="100" y1="80" x2="100" y2="120" stroke="#6de5e7" stroke-width="2"/>
  <line x1="80" y1="100" x2="120" y2="100" stroke="#6de5e7" stroke-width="2"/>
</svg>
